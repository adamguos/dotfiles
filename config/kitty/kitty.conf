# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #a2c7e5
background #262335
color0 #767676
color1 #af5f5f
color2 #5faf5f
color3 #af875f
color4 #5f87af
color5 #af87af
color6 #5f8787
color7 #9e9e9e
color8 #767676
color9 #d75f87
color10 #87d787
color11 #d7af87
color12 #5fafd7
color13 #d787d7
color14 #87afaf
color15 #c7c7c7
cursor #fbf9ff
cursor_text_color #262335
selection_foreground none
selection_background #353163
tab_bar_background #14131d
active_tab_foreground #a2c7e5
active_tab_background #262335
inactive_tab_foreground #848bbd
inactive_tab_background #1c1a27
active_border_color #a2c7e5
inactive_border_color #423e77

font_size               13.0
hide_window_decorations no
modify_font cell_width  100%
placement_strategy      bottom

# BEGIN_KITTY_FONTS
font_family      family="CMU Typewriter Text"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
