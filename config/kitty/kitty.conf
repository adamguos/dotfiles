# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #181811
background #e8e5d8
color0 #404040
color1 #ad1111
color2 #366032
color3 #5e571f
color4 #13579b
color5 #7322d1
color6 #365e53
color7 #42421f
color8 #483f38
color9 #ad1111
color10 #33602c
color11 #7f4913
color12 #215d74
color13 #7122d2
color14 #345e52
color15 #42420e
cursor #6b632b
cursor_text_color #e8e5d8
selection_foreground none
selection_background #d1cbb2
tab_bar_background #b9b7ac
active_tab_foreground #181811
active_tab_background #e8e5d8
inactive_tab_foreground #5d677a
inactive_tab_background #ccc9be
active_border_color #e8e5d8
inactive_border_color #455c73

font_size               13.0
hide_window_decorations no
modify_font cell_width  100%
placement_strategy      bottom

# BEGIN_KITTY_FONTS
font_family      family="CMU Typewriter Text"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
