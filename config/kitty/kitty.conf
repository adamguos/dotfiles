# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #4a3940
background #fbf6f7
color0 #6e5860
color1 #a7344a
color2 #297613
color3 #896502
color4 #3552ae
color5 #6b3895
color6 #076e75
color7 #f4e9ec
color8 #6e5860
color9 #a7344a
color10 #297613
color11 #896502
color12 #3552ae
color13 #6b3895
color14 #076e75
color15 #f0e2e6
cursor #4a3940
cursor_text_color #fbf6f7
selection_foreground none
selection_background #f6d5e0
tab_bar_background #c8c4c5
active_tab_foreground #4a3940
active_tab_background #fbf6f7
inactive_tab_foreground #8e7880
inactive_tab_background #dcd8d9
active_border_color #fbf6f7
inactive_border_color #e2c3cd

font_size               13.0
hide_window_decorations no
modify_font cell_width  100%
placement_strategy      bottom

# BEGIN_KITTY_FONTS
font_family      family="CMU Typewriter Text"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
