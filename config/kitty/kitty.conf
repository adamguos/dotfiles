# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #f5f5dc
background #08111c
color0 #536b83
color1 #ff7979
color2 #7fcf78
color3 #f0e68c
color4 #81c0ff
color5 #c695ff
color6 #69c3aa
color7 #f5f5dc
color8 #536b83
color9 #ffa0a0
color10 #a3e39a
color11 #f8b471
color12 #87ceeb
color13 #d2adff
color14 #8ad3be
color15 #fffff0
cursor #f0e68c
cursor_text_color #08111c
selection_foreground none
selection_background #24364d
tab_bar_background #04090f
active_tab_foreground #f5f5dc
active_tab_background #08111c
inactive_tab_foreground #708ca8
inactive_tab_background #060c15
active_border_color #08111c
inactive_border_color #7fa3c9

font_size               14.0
hide_window_decorations no
modify_font cell_width  100%
placement_strategy      bottom

# BEGIN_KITTY_FONTS
font_family      family="Fantasque Sans Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
