# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #181811
background #dcefe3
color0 #434343
color1 #b31212
color2 #386334
color3 #615b20
color4 #145ba1
color5 #7723d8
color6 #376156
color7 #454520
color8 #aba29a
color9 #b31212
color10 #35642e
color11 #844c14
color12 #226078
color13 #7524d9
color14 #366255
color15 #46460f
cursor #417144
cursor_text_color #dcefe3
selection_foreground none
selection_background #b2dcc1
tab_bar_background #b0bfb5
active_tab_foreground #181811
active_tab_background #dcefe3
inactive_tab_foreground #59705c
inactive_tab_background #c1d2c7
active_border_color #dcefe3
inactive_border_color #49634a

font_size               13.0
hide_window_decorations no
modify_font cell_width  100%
placement_strategy      bottom

# BEGIN_KITTY_FONTS
font_family      family="CMU Typewriter Text"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
