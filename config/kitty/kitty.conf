# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #dff4e4
background #0d0f0d
color0 #3c7153
color1 #caade1
color2 #7a77cd
color3 #2f594c
color4 #42647f
color5 #3e4d45
color6 #89d9d0
color7 #e8f4e7
color8 #3c7153
color9 #c7566f
color10 #41b193
color11 #a5c1cd
color12 #3788a2
color13 #243528
color14 #609f83
color15 #f0f4e7
cursor #42647f
cursor_text_color #0d1f0f
selection_foreground none
selection_background #133a35
tab_bar_background #070807
active_tab_foreground #dff4e4
active_tab_background #0d0f0d
inactive_tab_foreground #669a83
inactive_tab_background #090b09
active_border_color #41b193
