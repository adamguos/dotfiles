# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #e7dcc4
background #2c343a
color0 #45525c
color1 #e67c7f
color2 #a9c181
color3 #ddbd7f
color4 #7fbcb4
color5 #d69ab7
color6 #83c193
color7 #e7dcc4
color8 #45525c
color9 #ed9294
color10 #b0ce7b
color11 #edc77a
color12 #7ac9c0
color13 #e5a7c4
color14 #7dd093
color15 #b2a790
cursor #ebe2cf
cursor_text_color #2c343a
selection_foreground none
selection_background #615b51
tab_bar_background #181c1f
active_tab_foreground #e7dcc4
active_tab_background #2c343a
inactive_tab_foreground #6e7b85
