# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #cbd7d9
background #13161c
color0 #5f7a80
color1 #c88596
color2 #84c29b
color3 #cbc887
color4 #68a1eb
color5 #948be1
color6 #0acdd4
color7 #a4adae
color8 #5f7a80
color9 #c88596
color10 #84c29b
color11 #cbc887
color12 #68a1eb
color13 #948be1
color14 #0acdd4
color15 #cbd7d9
cursor #cbd7d9
cursor_text_color #13161c
selection_foreground none
selection_background #123f48
tab_bar_background #0a0c0f
active_tab_foreground #cbd7d9
active_tab_background #13161c
inactive_tab_foreground #5f7a80
inactive_tab_background #0e1015
