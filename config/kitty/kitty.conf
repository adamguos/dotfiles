# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #ffe0da
background #271311
color0 #83615b
color1 #ff7979
color2 #7fcf78
color3 #f0e68c
color4 #81c0ff
color5 #c695ff
color6 #68c0b6
color7 #fff7d7
color8 #83615b
color9 #ffa0a0
color10 #a3e39a
color11 #f8b471
color12 #87ceeb
color13 #d2adff
color14 #8fd1c7
color15 #f7f4e9
cursor #f0e68c
cursor_text_color #271311
selection_foreground none
selection_background #432823
tab_bar_background #150a09
active_tab_foreground #ffe0da
active_tab_background #271311
inactive_tab_foreground #a27d78
inactive_tab_background #1d0e0c
active_border_color #271311
inactive_border_color #ff7979

font_size               12
hide_window_decorations no
modify_font cell_width  100%
placement_strategy      bottom

# BEGIN_KITTY_FONTS
font_family      family='Iosevka Term Curly Slab'
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
