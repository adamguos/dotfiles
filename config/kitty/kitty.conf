# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #3d2b5a
background #f6f2ee
color0 #534c45
color1 #a5222f
color2 #396847
color3 #ac5402
color4 #2848a9
color5 #6e33ce
color6 #287980
color7 #f2e9e1
color8 #534c45
color9 #b3434e
color10 #577f63
color11 #b86e28
color12 #4863b6
color13 #8452d5
color14 #488d93
color15 #f4ece6
cursor #3d2b5a
cursor_text_color #f6f2ee
selection_foreground none
selection_background #e7d2be
tab_bar_background #c4c1be
active_tab_foreground #3d2b5a
active_tab_background #f6f2ee
inactive_tab_foreground #837a72
inactive_tab_background #d8d4d1
active_border_color #f6f2ee
inactive_border_color #e4dcd4

font_size               13
hide_window_decorations no
modify_font cell_width  100%
placement_strategy      bottom

# BEGIN_KITTY_FONTS
font_family      family='Geist Mono' variable_name=GeistMono wght=450
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
