# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #e6d5c2
background #171311
color0 #73665b
color1 #d1766e
color2 #99af6b
color3 #fcba81
color4 #58bdff
color5 #9480ba
color6 #4e89a2
color7 #a09384
color8 #73665b
color9 #d25780
color10 #43b16a
color11 #f4a21c
color12 #8bcfff
color13 #a692cd
color14 #20c9cb
color15 #e6d5c2
cursor #ea9875
cursor_text_color #171311
selection_foreground none
selection_background #2f1e17
tab_bar_background #0c0a09
active_tab_foreground #e6d5c2
active_tab_background #171311
inactive_tab_foreground #73665b
inactive_tab_background #110e0c
active_border_color #e6d5c2
