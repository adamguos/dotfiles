# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #3c3836
background #fbf1c7
color0 #928374
color1 #cc241d
color2 #98971a
color3 #d79921
color4 #458588
color5 #b16286
color6 #689d6a
color7 #7c6f64
color8 #928374
color9 #9d0006
color10 #79740e
color11 #b57614
color12 #076678
color13 #8f3f71
color14 #427b58
color15 #3c3836
cursor #3c3836
cursor_text_color #fbf1c7
selection_foreground none
selection_background #bdae93
tab_bar_background #c8c09f
active_tab_foreground #3c3836
active_tab_background #fbf1c7
inactive_tab_foreground #928374
inactive_tab_background #dcd4af
active_border_color #79740e
inactive_border_color #767676

font_size               13
hide_window_decorations no
modify_font cell_width  100%
placement_strategy      bottom

# BEGIN_KITTY_FONTS
font_family      family='Geist Mono' variable_name=GeistMono wght=450
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
