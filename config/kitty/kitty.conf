# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #dfdad4
background #1b1819
color0 #8f8384
color1 #df8073
color2 #6fcb93
color3 #ecc166
color4 #9b96e9
color5 #ba83cc
color6 #44d0c1
color7 #b5b0ac
color8 #8f8384
color9 #df8073
color10 #6fcb93
color11 #ecc166
color12 #9b96e9
color13 #ba83cc
color14 #44d0c1
color15 #dfdad4
cursor #dfdad4
cursor_text_color #1b1819
selection_foreground none
selection_background #47302f
tab_bar_background #0e0d0d
active_tab_foreground #dfdad4
active_tab_background #1b1819
inactive_tab_foreground #8f8384
inactive_tab_background #141212
active_border_color #1b1819
inactive_border_color #5c3a38

font_size               13.0
hide_window_decorations no
modify_font cell_width  100%
placement_strategy      bottom

# BEGIN_KITTY_FONTS
font_family      family="CMU Typewriter Text"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
