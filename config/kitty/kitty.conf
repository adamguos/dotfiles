# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #3a4238
background #fafae0
color0 #a1a7a0
color1 #c72a3c
color2 #27850b
color3 #a77b00
color4 #1745d5
color5 #8a4adf
color6 #188a9e
color7 #3a4238
color8 #a1a7a0
color9 #c72a3c
color10 #27850b
color11 #a77b00
color12 #1745d5
color13 #8a4adf
color14 #188a9e
color15 #3a4238
cursor #3a4238
cursor_text_color #fafae0
selection_foreground none
selection_background #dadac2
tab_bar_background #c8c8b3
active_tab_foreground #3a4238
active_tab_background #fafae0
inactive_tab_foreground #838781
inactive_tab_background #dcdcc5
active_border_color #3a4238
inactive_border_color #dadac2

font_size               13
hide_window_decorations no
modify_font cell_width  100%
placement_strategy      bottom

# BEGIN_KITTY_FONTS
font_family      family='Geist Mono' variable_name=GeistMono wght=450
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
