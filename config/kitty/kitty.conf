# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #4c4f6a
background #eff1f6
color0 #1c1c1c
color1 #af5f5f
color2 #5faf5f
color3 #af875f
color4 #5f87af
color5 #af87af
color6 #5f8787
color7 #9e9e9e
color8 #767676
color9 #d75f87
color10 #87d787
color11 #d7af87
color12 #5fafd7
color13 #d787d7
color14 #87afaf
color15 #c7c7c7
cursor #dc8a79
cursor_text_color #eff1f6
selection_foreground none
selection_background #bcc0cd
tab_bar_background #bfc0c4
active_tab_foreground #4c4f6a
active_tab_background #eff1f6
inactive_tab_foreground #7c7f94
inactive_tab_background #d2d4d8
active_border_color #4c4f6a
inactive_border_color #dce0e9

font_size               12
hide_window_decorations no
modify_font cell_width  100%
placement_strategy      bottom

# BEGIN_KITTY_FONTS
font_family      family='Iosevka Term Curly Slab' style=Medium
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
