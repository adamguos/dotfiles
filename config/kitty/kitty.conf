# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #161412
background #d8d8d8
color0 #383838
color1 #9e1010
color2 #31572e
color3 #554f1c
color4 #11508d
color5 #691fbe
color6 #2b5551
color7 #42380e
color8 #3f3731
color9 #9e1010
color10 #2f5829
color11 #744211
color12 #1e546a
color13 #671fc0
color14 #2c5650
color15 #3e3821
cursor #665b19
cursor_text_color #d8d8d8
selection_foreground none
selection_background #b9b9b9
tab_bar_background #acacac
active_tab_foreground #161412
active_tab_background #d8d8d8
inactive_tab_foreground #625f54
inactive_tab_background #bebebe
active_border_color #d8d8d8
inactive_border_color #565333

font_size               13
hide_window_decorations no
modify_font cell_width  100%
placement_strategy      bottom

# BEGIN_KITTY_FONTS
font_family      family='Geist Mono' variable_name=GeistMono wght=450
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
