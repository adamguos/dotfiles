# Put the following lines in your ~/.config/kitty/kitty.conf
foreground #d6cfc4
background #151a21
color0 #6f7480
color1 #e05a4e
color2 #7fa37a
color3 #d9a441
color4 #6fa6a8
color5 #a98bb5
color6 #e08a50
color7 #d6cfc4
color8 #6f7480
color9 #f7d6d3
color10 #dfe8de
color11 #f6e8d0
color12 #dbe9e9
color13 #eae2ed
color14 #f7e2d3
color15 #ffffff
cursor #d6cfc4
cursor_text_color #151a21
selection_foreground none
selection_background #2d343e
tab_bar_background #0b0e12
active_tab_foreground #d6cfc4
active_tab_background #151a21
inactive_tab_foreground #6f7480
inactive_tab_background #0f1318
active_border_color #d6cfc4
inactive_border_color #3d4652

font_size               12.0
hide_window_decorations no
modify_font cell_width  100%
placement_strategy      bottom

# BEGIN_KITTY_FONTS
font_family      family="Iosevka Term Curly Slab"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
